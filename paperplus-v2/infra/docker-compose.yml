services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: paperplus
      POSTGRES_PASSWORD: paperplus
      POSTGRES_DB: paperplus_v2
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: unless-stopped

  api-service:
    build:
      # Context is the paperplus-v2/ monorepo root, not api-service/ itself, so the Dockerfile
      # can COPY the sibling shared/ package (api-service/app imports it as `shared.contracts`
      # and `shared.logging_config`) -- it's physically outside a context scoped to api-service/.
      context: ..
      dockerfile: api-service/Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://paperplus:paperplus@postgres:5432/paperplus_v2
      VISION_SERVICE_URL: http://vision-service:8100
    depends_on:
      - postgres
      - vision-service
    volumes:
      - files_data:/app/files
    ports:
      - "8000:8000"
    restart: unless-stopped

  vision-service:
    build:
      context: ..
      dockerfile: vision-service/Dockerfile
    env_file: .env
    volumes:
      - files_data:/app/files
    # Not exposed externally on purpose — only api-service (and nginx via api-service) reach it.
    expose:
      - "8100"
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api-service
    ports:
      # Overridable via NGINX_HOST_PORT in .env -- defaults to 8080 rather than 80 because dev
      # machines often already have something bound to host port 80 (this was validated on a
      # box with a stray system Apache on 80, unrelated to this project, silently "winning" the
      # bind ahead of Docker). On a dedicated deploy VM with port 80 genuinely free, set
      # NGINX_HOST_PORT=80 in infra/.env.
      - "${NGINX_HOST_PORT:-8080}:80"
    restart: unless-stopped

volumes:
  postgres_data:
  files_data:
