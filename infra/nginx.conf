events {}

http {
    upstream api_service {
        server api-service:8000;
    }

    server {
        listen 80;

        # Photos uploaded to /api/admin/projects/<code>/scans (phone photos are several MB; the
        # 1 MB default would 413 them). Matches the endpoint's own 20 MB cap.
        client_max_body_size 20m;
        # A scan is graded inside the request (vision-service call has a 60 s timeout of its own).
        proxy_read_timeout 120s;

        location / {
            proxy_pass http://api_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}
